<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is-True // Buscador de la Verdad en Tiempo Real</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --text-color: #f1f5f9;
            --accent: #38bdf8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 600px; margin-top: 40px; }
        h1 { text-align: center; color: var(--accent); margin-bottom: 5px; font-size: 2.5rem; letter-spacing: -1px; }
        h1 span { color: white; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 1.1rem; }
        .box { background: var(--card-bg); padding: 25px; border-radius: 16px; border: 1px solid #1e293b; }
        textarea {
            width: 100%; height: 140px; background: #0b0f19; border: 1px solid #334155;
            border-radius: 10px; color: white; padding: 14px; font-size: 16px; box-sizing: border-box; resize: none;
        }
        textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        button {
            width: 100%; background: var(--accent); color: #0b0f19; border: none; padding: 16px;
            font-size: 16px; font-weight: bold; border-radius: 10px; margin-top: 15px; cursor: pointer; transition: all 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-1px); }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
        .result-card { margin-top: 25px; padding: 25px; border-radius: 16px; display: none; border: 1px solid #1e293b; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 15px; text-transform: uppercase; }
        .VERDADERO { background: #10b981; color: white; }
        .FALSO { background: #ef4444; color: white; }
        .ENGAÑOSO, .FALTA_CONTEXTO { background: #f59e0b; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Is-<span>True</span> 🔍</h1>
    <p class="subtitle">Buscador de la Verdad en tiempo real impulsado por IA.</p>
    
    <div class="box">
        <textarea id="newsInput" placeholder="Pega aquí la noticia, rumor o cadena sospechosa para verificar..."></textarea>
        <button id="verifyBtn" onclick="verificarConIsTrue()">Verificar con Is-True</button>
    </div>

    <div id="resultCard" class="result-card" style="background: var(--card-bg);">
        <span id="verdictBadge" class="badge">VERDICTO</span>
        <div style="font-size: 14px; color: #94a3b8; margin-bottom: 12px;">
            Precisión del análisis: <span id="confidenceText" style="font-weight: bold; color: white;">0%</span>
        </div>
        <p id="explanationText" style="line-height: 1.6; margin: 0; color: #cbd5e1;"></p>
    </div>
</div>

<script>
async function verificarConIsTrue() {
    const textInput = document.getElementById("newsInput").value.trim();
    const btn = document.getElementById("verifyBtn");
    const resultCard = document.getElementById("resultCard");
    
    if(!textInput) { alert("Por favor, introduce un texto para que Is-True pueda analizarlo."); return; }
    
    btn.disabled = true;
    btn.innerText = "Is-True está escaneando la web...";
    resultCard.style.display = "none";

    try {
        const response = await fetch("/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: textInput })
        });
        
        if(!response.ok) throw new Error("Error");
        const data = await response.json();
        
        const badge = document.getElementById("verdictBadge");
        badge.className = "badge " + data.verdict.replace(" ", "_");
        badge.innerText = data.verdict;
        
        document.getElementById("confidenceText").innerText = data.confidence_score + "%";
        document.getElementById("explanationText").innerText = data.explanation;
        
        resultCard.style.display = "block";
    } catch (error) {
        alert("Error de conexión con el motor de Is-True.");
    } finally {
        btn.disabled = false;
        btn.innerText = "Verificar con Is-True";
    }
}
</script>
</body>
</html>
